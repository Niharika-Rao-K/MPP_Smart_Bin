  </div>

  <script>
    /*
     * ============================================================
     * RECYCLE2EARN AUTHENTICATION
     * ============================================================
     *
     * Authentication is now handled by the FastAPI backend.
     *
     * Frontend:
     *     username + password
     *             ↓
     * Backend:
     *     POST /api/auth/login
     *             ↓
     * SQLite users table
     *
     * IMPORTANT:
     * We are temporarily keeping the active wallet in localStorage
     * because dashboard.html currently uses it to identify the user.
     * This will be removed in a later step.
     */

    const API_BASE_URL =
      'https://solid-succotash-97w5vgqj54vr277wv-8000.app.github.dev';

    const ACTIVE_WALLET_KEY = 'r2e_active_wallet';

    const customWalletSrc =
      'https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Fox.svg';


    /*
     * ============================================================
     * PAGE INITIALIZATION
     * ============================================================
     */

    document.addEventListener('DOMContentLoaded', () => {

      // Set MetaMask images.
      document
        .querySelectorAll('.wallet-icon-img, .footer-wallet-img')
        .forEach(img => {
          img.src = customWalletSrc;
        });

    });


    /*
     * ============================================================
     * LOGIN
     * ============================================================
     */

    document.getElementById('login-form').onsubmit = async function (event) {

      event.preventDefault();

      const username =
        document.getElementById('login-username').value.trim();

      const password =
        document.getElementById('login-pass').value;

      const loginButton =
        document.getElementById('login-button');


      if (!username || !password) {
        alert('Please enter your username and password.');
        return;
      }


      loginButton.disabled = true;
      loginButton.textContent = 'Logging in...';


      try {

        const response = await fetch(
          `${API_BASE_URL}/api/auth/login`,
          {
            method: 'POST',

            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify({
              username: username,
              password: password
            })
          }
        );


        const data = await response.json();


        if (!response.ok) {
          throw new Error(
            data.detail || 'Login failed. Please try again.'
          );
        }


        /*
         * The backend returns the authenticated user's wallet.
         *
         * Dashboard currently uses this wallet to load:
         *     /api/deposits/{wallet}
         *
         * Therefore we temporarily keep the wallet in localStorage.
         */
        localStorage.setItem(
          ACTIVE_WALLET_KEY,
          data.user.wallet_address
        );


        // Login successful.
        window.location.replace('dashboard.html');

      } catch (error) {

        console.error('Login error:', error);

        alert(
          error.message ||
          'Unable to connect to the authentication server.'
        );

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = 'Login';

      }

    };


    /*
     * ============================================================
     * REGISTRATION
     * ============================================================
     */

    document.getElementById('register-form').onsubmit = async function (event) {

      event.preventDefault();


      const fullName =
        document.getElementById('reg-full-name').value.trim();

      const username =
        document.getElementById('reg-username').value.trim();

      const password =
        document.getElementById('reg-pass').value;

      const wallet =
        document.getElementById('reg-wallet').value.trim();

      const registerButton =
        document.getElementById('register-button');


      if (!fullName) {
        alert('Please enter your full name.');
        return;
      }


      if (!username) {
        alert('Please enter a username.');
        return;
      }


      if (password.length < 4) {
        alert('Password must contain at least 4 characters.');
        return;
      }


      if (!/^0x[a-fA-F0-9]{40}$/.test(wallet)) {
        alert(
          'Please enter a valid MetaMask wallet address starting with 0x.'
        );
        return;
      }


      registerButton.disabled = true;
      registerButton.textContent = 'Creating account...';


      try {

        const response = await fetch(
          `${API_BASE_URL}/api/auth/register`,
          {
            method: 'POST',

            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify({
              full_name: fullName,
              username: username,
              password: password,
              wallet_address: wallet
            })
          }
        );


        const data = await response.json();


        if (!response.ok) {
          throw new Error(
            data.detail ||
            'Registration failed. Please try again.'
          );
        }


        /*
         * Registration succeeded.
         *
         * The backend has already created the SQLite user and
         * securely hashed the password.
         *
         * We temporarily save only the wallet address because
         * dashboard.html currently uses it as the user's identity.
         */
        localStorage.setItem(
          ACTIVE_WALLET_KEY,
          data.user.wallet_address
        );


        alert('Account created successfully!');

        window.location.replace('dashboard.html');

      } catch (error) {

        console.error('Registration error:', error);

        alert(
          error.message ||
          'Unable to connect to the authentication server.'
        );

      } finally {

        registerButton.disabled = false;
        registerButton.textContent = 'Register';

      }

    };


    /*
     * ============================================================
     * SCREEN SWITCHING
     * ============================================================
     */

    function showRegister() {

      document
        .getElementById('login-form')
        .classList.add('hidden');

      document
        .getElementById('register-form')
        .classList.remove('hidden');

      document
        .getElementById('back-button')
        .style.display = 'block';

    }


    function showLogin() {

      document
        .getElementById('register-form')
        .classList.add('hidden');

      document
        .getElementById('login-form')
        .classList.remove('hidden');

      document
        .getElementById('back-button')
        .style.display = 'none';

    }


    /*
     * ============================================================
     * PASSWORD VISIBILITY
     * ============================================================
     */

    function toggleVisibility(inputId, btn) {

      const input =
        document.getElementById(inputId);

      const icon =
        btn.querySelector('i');


      if (input.type === 'password') {

        input.type = 'text';

        icon.className =
          'fa-regular fa-eye-slash';

      } else {

        input.type = 'password';

        icon.className =
          'fa-regular fa-eye';

      }

    }


    /*
     * ============================================================
     * FORGOT PASSWORD
     * ============================================================
     *
     * This will be implemented in Step 24E.
     *
     * We intentionally do not implement a weak
     * "username + wallet = reset password" mechanism.
     */

    function handleForgotPassword(event) {

      event.preventDefault();

      alert(
        'Password recovery will be connected to MetaMask in the next step.'
      );

    }


    /*
     * ============================================================
     * METAMASK LOGIN
     * ============================================================
     *
     * This will be implemented in Step 24F.
     */

    function handleMetaMaskLogin() {

      alert(
        'MetaMask login will be connected in the next step.'
      );

    }


    /*
     * ============================================================
     * METAMASK REGISTRATION
     * ============================================================
     *
     * This will also be implemented in Step 24F.
     */

    function handleMetaMaskRegister() {

      alert(
        'MetaMask registration will be connected in the next step.'
      );

    }

  </script>
